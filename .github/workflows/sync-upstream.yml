name: Sync Upstream Model Catalogs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync pi.dev & models.dev
        run: bun run sync

      - name: Build & validate catalog
        run: |
          bun run build
          bun run validate
          bun run typecheck
          bun test

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          commit-message: 'chore(upstream): sync pi.dev and models.dev snapshots'
          branch: chore/sync-upstream-catalog
          delete-branch: true
          title: 'chore(upstream): sync pi.dev and models.dev snapshots'
          body: |
            Automated daily upstream sync from `pi.dev/api/models` and `models.dev/catalog.json`.

            - Validated schema, restricted CEL option maps, pricing schedules, and provider allowlist.
            - Review the upstream diff before merging to deploy to Cloudflare Pages (`models.codepilotx.top`).
          add-paths: |
            src/upstream/
