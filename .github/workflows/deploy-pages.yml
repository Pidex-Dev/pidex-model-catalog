name: Deploy Catalog to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reuse the timestamps of unchanged v2 files
        run: |
          mkdir -p dist/v2
          for file in providers models; do
            curl --fail --silent --show-error --max-time 15 "https://models.codepilotx.top/v2/$file.json" --output "dist/v2/$file.json" || true
          done

      - name: Build, validate & test
        run: |
          bun run build
          bun run validate
          bun run typecheck
          bun test

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=pidex-model-catalog --branch=main
